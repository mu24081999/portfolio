<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <meta name="theme-color" content="#04060d" />
    <meta name="author" content="Muhammad Umar Liaqat" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script>
      // Set the theme before first paint (saved choice, else the OS preference) to avoid a flash.
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef2f9');
      })();
    </script>
    <link rel="preload" as="image" href="/brand/mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript><style>.preloader { display: none !important; }</style></noscript>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
